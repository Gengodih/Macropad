# Builds firmware + app + installer.
# Start it on GitHub: Actions > Release > Run workflow.
#   - "Publish for everyone" off (default): test build only. The setup is at the
#     bottom of the run page under "Artifacts"; nobody's app sees it as an update.
#   - "Publish for everyone" on: a GitHub release named after VERSION in
#     app/macropad_app/__init__.py - every installed app offers it as an update.
# Pushing a tag v1.2.3 always publishes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish for everyone (off = test build only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build firmware
        run: |
          pip install platformio
          pio run -d firmware
      - name: Pack firmware for the app
        run: |
          python tools/build_firmware_bundle.py firmware/.pio/build/tdisplay_s3 \
            ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            firmware/macropad/macropad.ino firmware-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware-bundle
      # The pad's animations for the app's previews (bgfx.dll), cross-built for
      # Windows from the same code as the firmware
      - name: Build background renderer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++-mingw-w64-x86-64-posix
          python tools/build_bgfx.py --windows
          python tools/build_bgfx.py
          python tests/native/run_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: bgfx
          path: app/macropad_app/resources/bgfx.dll

  windows:
    needs: firmware
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: app/macropad_app/resources/firmware
      - uses: actions/download-artifact@v4
        with:
          name: bgfx
          path: app/macropad_app/resources
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versions
        id: v
        shell: bash
        run: |
          APP=$(python -c "import sys; sys.path.insert(0,'app'); import macropad_app; print(macropad_app.VERSION)")
          FW=$(python -c "import json; print(json.load(open('app/macropad_app/resources/firmware/firmware.json'))['version'])")
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "fw=$FW" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$APP" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $APP in app/macropad_app/__init__.py"; exit 1
          fi
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build app
        shell: bash
        run: |
          echo "UPDATE_REPO = \"${GITHUB_REPOSITORY}\"" > app/macropad_app/_build_info.py
          python tools/make_icon.py app/macropad_app/resources
          pyinstaller --noconfirm macropad.spec
          python tools/make_manifest.py files dist/MacroPad ${{ steps.v.outputs.app }} ${{ steps.v.outputs.fw }}
      - name: Check that the built app starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MacroPad\MacroPad.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "MacroPad.exe --selftest failed (exit $($p.ExitCode))"; exit 1 }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=${{ steps.v.outputs.app }}" installer\macropad.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release files
        shell: bash
        run: |
          python tools/make_manifest.py release dist/MacroPad dist/MacroPad-Setup-${{ steps.v.outputs.app }}.exe dist/manifest.json
          cd app/macropad_app/resources/firmware && 7z a ../../../../dist/firmware-${{ steps.v.outputs.fw }}.zip *
      - name: Test build (not published)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: Test-Setup-${{ steps.v.outputs.app }}
          path: dist/MacroPad-Setup-${{ steps.v.outputs.app }}.exe
          retention-days: 14
      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.app }}
          name: Macro Pad ${{ steps.v.outputs.app }}
          make_latest: true
          body_path: dist/release-notes.md
          files: |
            dist/MacroPad-Setup-${{ steps.v.outputs.app }}.exe
            dist/manifest.json
            dist/firmware-${{ steps.v.outputs.fw }}.zip
