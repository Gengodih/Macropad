; Builds the firmware for the app's updates (GitHub Actions and build.bat).
; Same settings as the Arduino IDE instructions at the top of macropad.ino:
; ESP32S3 Dev Module, USB-OTG (TinyUSB), USB CDC on boot, 16 MB flash, OPI PSRAM,
; default partition table.
[platformio]
src_dir = macropad

[env:tdisplay_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default.csv
lib_ldf_mode = deep+
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
lib_deps =
  FS
  https://github.com/moononournation/Arduino_GFX.git#v1.6.9
  https://github.com/adafruit/Adafruit_NeoPixel.git#1.15.5
